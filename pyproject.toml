[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tr-ru-forecast"
version = "0.1.0"
description = "TR–RU Bilateral Trade Forecasting & Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "TR-RU Trade Forecasting Project Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "uvicorn>=0.29.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "statsmodels>=0.14.0",
    "scipy>=1.12.0",
    "xgboost>=2.0.0",
    "shap>=0.45.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.setuptools.package-data]
"tr_ru_forecast.models.ml" = ["*.yaml"]
