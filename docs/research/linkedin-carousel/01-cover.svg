<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" fill="#f4f2eb" stroke="none" /><rect x="60" y="48" width="48" height="36" fill="#1f292c" stroke="none" /><text x="84" y="72" fill="#f4f2eb" font-family="monospace" font-size="12" font-weight="700" letter-spacing="0" text-anchor="middle">TR/RU</text><text x="126" y="72" fill="#626d70" font-family="monospace" font-size="14" font-weight="600" letter-spacing="1" text-anchor="start">BILATERAL TRADE RESEARCH</text><line x1="60" y1="105" x2="1020" y2="105" stroke="#1f292c" stroke-width="2" /><text x="60" y="190" fill="#245b52" font-family="monospace" font-size="15" font-weight="700" letter-spacing="1.2" text-anchor="start">A MONTHLY VIEW OF BILATERAL TRADE</text><text x="60" y="330" fill="#1f292c" font-family="Georgia, Times New Roman, serif" font-size="72" font-weight="400" letter-spacing="0" text-anchor="start">Türkiye–Russia</text><text x="60" y="416" fill="#1f292c" font-family="Georgia, Times New Roman, serif" font-size="72" font-weight="400" letter-spacing="0" text-anchor="start">Trade Forecasting</text><text x="60" y="525" fill="#626d70" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" letter-spacing="0" text-anchor="start">Forecasts, model comparison and mirror statistics</text><line x1="60" y1="630" x2="1020" y2="630" stroke="#1f292c" stroke-width="2" /><rect x="60" y="690" width="455" height="130" fill="#fbfaf6" stroke="#cbd0cb" /><rect x="565" y="690" width="455" height="130" fill="#fbfaf6" stroke="#cbd0cb" /><text x="88" y="740" fill="#245b52" font-family="monospace" font-size="28" font-weight="700" letter-spacing="0" text-anchor="start">TR → RU</text><text x="88" y="780" fill="#1f292c" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" letter-spacing="0" text-anchor="start">Türkiye exports to Russia</text><text x="592" y="740" fill="#ad5c3c" font-family="monospace" font-size="28" font-weight="700" letter-spacing="0" text-anchor="start">RU → TR</text><text x="592" y="780" fill="#1f292c" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" letter-spacing="0" text-anchor="start">Türkiye imports from Russia</text><text x="60" y="940" fill="#1f292c" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" letter-spacing="0" text-anchor="start">A research and decision-support platform</text><text x="60" y="982" fill="#1f292c" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" letter-spacing="0" text-anchor="start">for 14 monthly trade series.</text><text x="60" y="1120" fill="#626d70" font-family="monospace" font-size="16" font-weight="600" letter-spacing="0.8" text-anchor="start">1, 3 AND 6-MONTH FORECAST HORIZONS</text><line x1="60" y1="1270" x2="1020" y2="1270" stroke="#1f292c" stroke-width="2" /><text x="60" y="1310" fill="#626d70" font-family="monospace" font-size="12" font-weight="600" letter-spacing="0.6" text-anchor="start">TR–RU FORECAST · RESEARCH PROJECT</text><text x="1020" y="1310" fill="#626d70" font-family="monospace" font-size="12" font-weight="600" letter-spacing="0" text-anchor="end">01 / 07</text></svg>