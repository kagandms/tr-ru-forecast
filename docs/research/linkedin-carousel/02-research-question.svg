<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" fill="#f4f2eb" stroke="none" /><rect x="60" y="48" width="48" height="36" fill="#1f292c" stroke="none" /><text x="84" y="72" fill="#f4f2eb" font-family="monospace" font-size="12" font-weight="700" letter-spacing="0" text-anchor="middle">TR/RU</text><text x="126" y="72" fill="#626d70" font-family="monospace" font-size="14" font-weight="600" letter-spacing="1" text-anchor="start">BILATERAL TRADE RESEARCH</text><line x1="60" y1="105" x2="1020" y2="105" stroke="#1f292c" stroke-width="2" /><text x="60" y="180" fill="#245b52" font-family="monospace" font-size="15" font-weight="700" letter-spacing="1" text-anchor="start">01 / THE QUESTION</text><text x="60" y="300" fill="#1f292c" font-family="Georgia, Times New Roman, serif" font-size="58" font-weight="400" letter-spacing="0" text-anchor="start">Can forecasting models</text><text x="60" y="372" fill="#1f292c" font-family="Georgia, Times New Roman, serif" font-size="58" font-weight="400" letter-spacing="0" text-anchor="start">improve monthly trade</text><text x="60" y="444" fill="#1f292c" font-family="Georgia, Times New Roman, serif" font-size="58" font-weight="400" letter-spacing="0" text-anchor="start">forecasts?</text><text x="60" y="555" fill="#626d70" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start">The project compares model results with a simple seasonal baseline.</text><line x1="60" y1="630" x2="1020" y2="630" stroke="#1f292c" stroke-width="2" /><text x="60" y="720" fill="#626d70" font-family="monospace" font-size="14" font-weight="700" letter-spacing="1" text-anchor="start">PROJECT SCOPE</text><text x="60" y="835" fill="#1f292c" font-family="Georgia, Times New Roman, serif" font-size="80" font-weight="400" letter-spacing="0" text-anchor="start">14</text><text x="60" y="885" fill="#626d70" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" letter-spacing="0" text-anchor="start">monthly series</text><line x1="350" y1="755" x2="350" y2="930" stroke="#cbd0cb" stroke-width="1" /><text x="410" y="835" fill="#1f292c" font-family="Georgia, Times New Roman, serif" font-size="80" font-weight="400" letter-spacing="0" text-anchor="start">2</text><text x="410" y="885" fill="#626d70" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" letter-spacing="0" text-anchor="start">trade directions</text><line x1="700" y1="755" x2="700" y2="930" stroke="#cbd0cb" stroke-width="1" /><text x="760" y="835" fill="#1f292c" font-family="Georgia, Times New Roman, serif" font-size="80" font-weight="400" letter-spacing="0" text-anchor="start">3</text><text x="760" y="885" fill="#626d70" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" letter-spacing="0" text-anchor="start">forecast horizons</text><text x="60" y="1035" fill="#245b52" font-family="monospace" font-size="19" font-weight="600" letter-spacing="0" text-anchor="start">h = 1 month     h = 3 months     h = 6 months</text><text x="60" y="1130" fill="#626d70" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" letter-spacing="0" text-anchor="start">Both forecast targets use Türkiye-reported trade data.</text><text x="60" y="1159" fill="#626d70" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" letter-spacing="0" text-anchor="start">Russia-reported records are kept for comparison.</text><line x1="60" y1="1270" x2="1020" y2="1270" stroke="#1f292c" stroke-width="2" /><text x="60" y="1310" fill="#626d70" font-family="monospace" font-size="12" font-weight="600" letter-spacing="0.6" text-anchor="start">TR–RU FORECAST · RESEARCH PROJECT</text><text x="1020" y="1310" fill="#626d70" font-family="monospace" font-size="12" font-weight="600" letter-spacing="0" text-anchor="end">02 / 07</text></svg>