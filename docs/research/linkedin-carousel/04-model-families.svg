<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" fill="#f4f2eb" stroke="none" /><rect x="60" y="48" width="48" height="36" fill="#1f292c" stroke="none" /><text x="84" y="72" fill="#f4f2eb" font-family="monospace" font-size="12" font-weight="700" letter-spacing="0" text-anchor="middle">TR/RU</text><text x="126" y="72" fill="#626d70" font-family="monospace" font-size="14" font-weight="600" letter-spacing="1" text-anchor="start">BILATERAL TRADE RESEARCH</text><line x1="60" y1="105" x2="1020" y2="105" stroke="#1f292c" stroke-width="2" /><text x="60" y="180" fill="#245b52" font-family="monospace" font-size="15" font-weight="700" letter-spacing="1" text-anchor="start">03 / THE MODELS</text><text x="60" y="300" fill="#1f292c" font-family="Georgia, Times New Roman, serif" font-size="55" font-weight="400" letter-spacing="0" text-anchor="start">Four ways to forecast</text><text x="60" y="365" fill="#626d70" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" letter-spacing="0" text-anchor="start">Each method is tested on the same time-based schedule.</text><line x1="60" y1="420" x2="1020" y2="420" stroke="#1f292c" stroke-width="2" /><text x="65" y="525" fill="#245b52" font-family="monospace" font-size="14" font-weight="700" letter-spacing="0" text-anchor="start">01</text><text x="145" y="525" fill="#1f292c" font-family="monospace" font-size="20" font-weight="700" letter-spacing="0" text-anchor="start">SEASONAL NAIVE</text><text x="145" y="568" fill="#626d70" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" letter-spacing="0" text-anchor="start">Uses the value from the same month last year.</text><line x1="145" y1="605" x2="1020" y2="605" stroke="#cbd0cb" stroke-width="1" /><text x="65" y="680" fill="#245b52" font-family="monospace" font-size="14" font-weight="700" letter-spacing="0" text-anchor="start">02</text><text x="145" y="680" fill="#1f292c" font-family="monospace" font-size="20" font-weight="700" letter-spacing="0" text-anchor="start">SARIMA</text><text x="145" y="723" fill="#626d70" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" letter-spacing="0" text-anchor="start">Learns patterns from the trade series history.</text><line x1="145" y1="760" x2="1020" y2="760" stroke="#cbd0cb" stroke-width="1" /><text x="65" y="835" fill="#245b52" font-family="monospace" font-size="14" font-weight="700" letter-spacing="0" text-anchor="start">03</text><text x="145" y="835" fill="#1f292c" font-family="monospace" font-size="20" font-weight="700" letter-spacing="0" text-anchor="start">SARIMAX</text><text x="145" y="878" fill="#626d70" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" letter-spacing="0" text-anchor="start">Adds economic indicators available at the forecast origin.</text><line x1="145" y1="915" x2="1020" y2="915" stroke="#cbd0cb" stroke-width="1" /><text x="65" y="990" fill="#245b52" font-family="monospace" font-size="14" font-weight="700" letter-spacing="0" text-anchor="start">04</text><text x="145" y="990" fill="#1f292c" font-family="monospace" font-size="20" font-weight="700" letter-spacing="0" text-anchor="start">XGBOOST</text><text x="145" y="1033" fill="#626d70" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" letter-spacing="0" text-anchor="start">Learns more complex patterns from prepared features.</text><line x1="145" y1="1070" x2="1020" y2="1070" stroke="#cbd0cb" stroke-width="1" /><text x="60" y="1185" fill="#245b52" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" letter-spacing="0" text-anchor="start">A champion is selected separately for each</text><text x="60" y="1213" fill="#245b52" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" letter-spacing="0" text-anchor="start">trade series and forecast horizon.</text><line x1="60" y1="1270" x2="1020" y2="1270" stroke="#1f292c" stroke-width="2" /><text x="60" y="1310" fill="#626d70" font-family="monospace" font-size="12" font-weight="600" letter-spacing="0.6" text-anchor="start">TR–RU FORECAST · RESEARCH PROJECT</text><text x="1020" y="1310" fill="#626d70" font-family="monospace" font-size="12" font-weight="600" letter-spacing="0" text-anchor="end">04 / 07</text></svg>