/text><text x="60" y="815" fill="#245b52" font-family="monospace" font-size="28" font-weight="600" letter-spacing="0" text-anchor="start">frontend-ten-psi-12.vercel.app</text><rect x="60" y="925" width="960" height="205" fill="#fbfaf6" stroke="#cbd0cb" /><text x="84" y="970" fill="#ad5c3c" font-family="monospace" font-size="14" font-weight="700" letter-spacing="0.8" text-anchor="start">SCOPE NOTE</text><text x="84" y="1020" fill="#1f292c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" letter-spacing="0" text-anchor="start">The dashboard presents a retrospective holdout, not live forecasts.</text><text x="84" y="1051" fill="#1f292c" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" letter-spacing="0" text-anchor="start">Source-rights review for some macro inputs is still in progress.</text><text x="60" y="1195" fill="#626d70" font-family="monospace" font-size="14" font-weight="600" letter-spacing="0.5" text-anchor="start">BUILT FOR REPRODUCIBILITY AND TRANSPARENT COMPARISON</text><line x1="60" y1="1270" x2="1020" y2="1270" stroke="#1f292c" stroke-width="2" /><text x="60" y="1310" fill="#626d70" font-family="monospace" font-size="12" font-weight="600" letter-spacing="0.6" text-anchor="start">TR–RU FORECAST · RESEARCH PROJECT</text><text x="1020" y="1310" fill="#626d70" font-family="monospace" font-size="12" font-weight="600" letter-spacing="0" text-anchor="end">07 / 07</text></svg>