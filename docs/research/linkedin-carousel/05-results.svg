<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" fill="#f4f2eb" stroke="none" /><rect x="60" y="48" width="48" height="36" fill="#1f292c" stroke="none" /><text x="84" y="72" fill="#f4f2eb" font-family="monospace" font-size="12" font-weight="700" letter-spacing="0" text-anchor="middle">TR/RU</text><text x="126" y="72" fill="#626d70" font-family="monospace" font-size="14" font-weight="600" letter-spacing="1" text-anchor="start">BILATERAL TRADE RESEARCH</text><line x1="60" y1="105" x2="1020" y2="105" stroke="#1f292c" stroke-width="2" /><text x="60" y="180" fill="#245b52" font-family="monospace" font-size="15" font-weight="700" letter-spacing="1" text-anchor="start">04 / THE RESULT</text><text x="60" y="300" fill="#1f292c" font-family="Georgia, Times New Roman, serif" font-size="50" font-weight="400" letter-spacing="0" text-anchor="start">How did the forecasts perform?</text><text x="60" y="365" fill="#626d70" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" letter-spacing="0" text-anchor="start">Average error on the 2025 holdout. Lower sMAPE is better.</text><line x1="60" y1="420" x2="1020" y2="420" stroke="#1f292c" stroke-width="2" /><text x="60" y="530" fill="#1f292c" font-family="monospace" font-size="15" font-weight="700" letter-spacing="0" text-anchor="start">OPERATIONAL MODEL SYSTEM</text><rect x="60" y="555" width="480" height="66" fill="#245b52" stroke="none" /><text x="570" y="602" fill="#245b52" font-family="Georgia, Times New Roman, serif" font-size="37" font-weight="400" letter-spacing="0" text-anchor="start">26.17%</text><text x="60" y="700" fill="#1f292c" font-family="monospace" font-size="15" font-weight="700" letter-spacing="0" text-anchor="start">SEASONAL NAIVE BASELINE</text><rect x="60" y="725" width="690" height="66" fill="#727b78" stroke="none" /><text x="780" y="772" fill="#1f292c" font-family="Georgia, Times New Roman, serif" font-size="37" font-weight="400" letter-spacing="0" text-anchor="start">37.50%</text><line x1="60" y1="870" x2="1020" y2="870" stroke="#1f292c" stroke-width="2" /><text x="60" y="980" fill="#1f292c" font-family="Georgia, Times New Roman, serif" font-size="64" font-weight="400" letter-spacing="0" text-anchor="start">36 / 42</text><text x="340" y="955" fill="#626d70" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start">tasks had lower average error</text><text x="340" y="989" fill="#626d70" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start">than the Seasonal Naive baseline.</text><rect x="60" y="1080" width="960" height="112" fill="#eeede6" stroke="none" /><text x="82" y="1124" fill="#1f292c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" letter-spacing="0" text-anchor="start">This is a retrospective 2025 evaluation using latest-vintage data</text><text x="82" y="1150" fill="#1f292c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" letter-spacing="0" text-anchor="start">and fixed lag rules. It is not a real-time performance test.</text><line x1="60" y1="1270" x2="1020" y2="1270" stroke="#1f292c" stroke-width="2" /><text x="60" y="1310" fill="#626d70" font-family="monospace" font-size="12" font-weight="600" letter-spacing="0.6" text-anchor="start">TR–RU FORECAST · RESEARCH PROJECT</text><text x="1020" y="1310" fill="#626d70" font-family="monospace" font-size="12" font-weight="600" letter-spacing="0" text-anchor="end">05 / 07</text></svg>