<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" fill="#f4f2eb" stroke="none" /><rect x="60" y="48" width="48" height="36" fill="#1f292c" stroke="none" /><text x="84" y="72" fill="#f4f2eb" font-family="monospace" font-size="12" font-weight="700" letter-spacing="0" text-anchor="middle">TR/RU</text><text x="126" y="72" fill="#626d70" font-family="monospace" font-size="14" font-weight="600" letter-spacing="1" text-anchor="start">BILATERAL TRADE RESEARCH</text><line x1="60" y1="105" x2="1020" y2="105" stroke="#1f292c" stroke-width="2" /><text x="60" y="180" fill="#245b52" font-family="monospace" font-size="15" font-weight="700" letter-spacing="1" text-anchor="start">05 / A QUICK GUIDE</text><text x="60" y="300" fill="#1f292c" font-family="Georgia, Times New Roman, serif" font-size="55" font-weight="400" letter-spacing="0" text-anchor="start">Four terms to know</text><line x1="60" y1="355" x2="1020" y2="355" stroke="#1f292c" stroke-width="2" /><text x="60" y="470" fill="#245b52" font-family="monospace" font-size="16" font-weight="700" letter-spacing="0.5" text-anchor="start">CHAMPION</text><text x="60" y="518" fill="#1f292c" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" letter-spacing="0" text-anchor="start">The model selected for one trade series and horizon.</text><line x1="60" y1="558" x2="1020" y2="558" stroke="#cbd0cb" stroke-width="1" /><text x="60" y="640" fill="#245b52" font-family="monospace" font-size="16" font-weight="700" letter-spacing="0.5" text-anchor="start">HOLDOUT</text><text x="60" y="688" fill="#1f292c" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" letter-spacing="0" text-anchor="start">Data saved for the final model test. Here, it is 2025.</text><line x1="60" y1="728" x2="1020" y2="728" stroke="#cbd0cb" stroke-width="1" /><text x="60" y="810" fill="#245b52" font-family="monospace" font-size="16" font-weight="700" letter-spacing="0.5" text-anchor="start">MIRROR STATISTICS</text><text x="60" y="858" fill="#1f292c" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" letter-spacing="0" text-anchor="start">A comparison of Türkiye and Russia trade reports.</text><line x1="60" y1="898" x2="1020" y2="898" stroke="#cbd0cb" stroke-width="1" /><text x="60" y="980" fill="#245b52" font-family="monospace" font-size="16" font-weight="700" letter-spacing="0.5" text-anchor="start">sMAPE</text><text x="60" y="1028" fill="#1f292c" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" letter-spacing="0" text-anchor="start">A forecast error score. A lower score is better.</text><line x1="60" y1="1068" x2="1020" y2="1068" stroke="#cbd0cb" stroke-width="1" /><text x="60" y="1195" fill="#626d70" font-family="monospace" font-size="16" font-weight="700" letter-spacing="0" text-anchor="start">TR / EN / RU DASHBOARD</text><line x1="60" y1="1270" x2="1020" y2="1270" stroke="#1f292c" stroke-width="2" /><text x="60" y="1310" fill="#626d70" font-family="monospace" font-size="12" font-weight="600" letter-spacing="0.6" text-anchor="start">TR–RU FORECAST · RESEARCH PROJECT</text><text x="1020" y="1310" fill="#626d70" font-family="monospace" font-size="12" font-weight="600" letter-spacing="0" text-anchor="end">06 / 07</text></svg>